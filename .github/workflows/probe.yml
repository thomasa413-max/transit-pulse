name: Probe map data (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          UA="transit-pulse-poc/1.0"
          SP=$(curl -sSL -A "$UA" "https://data.opentransportdata.swiss/en/dataset/service-point-v2" | grep -oE 'https?://[^"]*actual-date-swiss-service-point\.csv' | head -1)
          echo "== service points: $SP"; curl -sSL -A "$UA" "$SP" -o /tmp/sp.csv -w "HTTP %{http_code} %{size_download}\n"
          head -c 3 /tmp/sp.csv | od -c | head -1
          head -1 /tmp/sp.csv; echo; grep -m4 "Lausanne, Bel-Air\|,Lausanne,\|;Lausanne;" /tmp/sp.csv | cut -c1-1200
          echo "== istdaten Lausanne rows"; U=$(curl -sSL -A "$UA" "https://data.opentransportdata.swiss/en/dataset/ist-daten-v2" | grep -oiE 'https?://[^"]*_istdaten\.csv' | sort -u | tail -1); echo "$U"
          curl -sSL -A "$UA" "$U" | grep -m6 "Lausanne" | cut -d';' -f6,8,13,14,22
      - name: Save report
        if: always()
        run: |
          git config user.name transit-pulse-bot; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan probe-results; git rm -rfq . >/dev/null; cp /tmp/report.txt report.txt
          git add report.txt; git commit -qm "Probe report"; git push -qf origin probe-results

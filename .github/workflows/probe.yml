name: Probe stop names (temporary)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          UA="transit-pulse-poc/1.0"
          U=$(curl -sSL -A "$UA" "https://data.opentransportdata.swiss/en/dataset/ist-daten-v2" | grep -oiE 'https?://[^"]*2026-10-21_istdaten\.csv' | head -1)
          curl -sSL -A "$UA" "$U" -o /tmp/d.csv
          echo "== operators with 'tl' or Lausanne-ish"; cut -d';' -f4,5 /tmp/d.csv | sort | uniq -c | sort -rn | grep -iE "tl|lausanne|LEB|MBC" | head
          echo "== stop names for operator TL (top 60 by rows)"; awk -F';' '$4=="TL"||$4=="tl"{print $14}' /tmp/d.csv | sort | uniq -c | sort -rn | head -60
          echo "== count distinct TL stop names"; awk -F';' '$4=="TL"||$4=="tl"{print $14}' /tmp/d.csv | sort -u | wc -l
          echo "== names containing Bel-Air / Ouchy / François"; grep -oE ';[^;]*(Bel-Air|Ouchy|Fran[cç]ois)[^;]*;' /tmp/d.csv | sort | uniq -c | sort -rn | head
          echo "== status values for TL"; awk -F';' '$4=="TL"||$4=="tl"{print $20}' /tmp/d.csv | sort | uniq -c
      - name: Save report
        if: always()
        run: |
          git config --global user.name transit-pulse-bot; git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q r && cd r && cp /tmp/report.txt . && git checkout -q -b probe-results && git add . && git commit -qm "Probe report"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results

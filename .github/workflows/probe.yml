name: Probe data access (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check catalogue and download routes
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          UA="transit-pulse-poc/1.0 (+https://github.com/thomasa413-max/transit-pulse)"
          curl -sS -A "$UA" --max-time 60 "https://data.opentransportdata.swiss/en/dataset/ist-daten-v2" -o /tmp/page.html
          echo "== links containing istdaten"; grep -oiE 'href="[^"]*istdaten[^"]*"' /tmp/page.html | sort -u | tail -15
          echo "== resource links"; grep -oE 'href="[^"]*/resource/[^"]*"' /tmp/page.html | sort -u | head -8
          echo "== resource names"; grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}_[Ii]st[Dd]aten[^<" ]*' /tmp/page.html | sort -u | tail -8
          URL=$(grep -oiE 'https?://[^"]*2026-10-2[01]_istdaten\.csv' /tmp/page.html | head -1)
          echo "== try download: $URL"
          [ -n "$URL" ] && curl -sS -L -A "$UA" --max-time 40 -r 0-600 -o /tmp/head.csv -w "HTTP %{http_code} %{content_type}\n" "$URL" && head -c 600 /tmp/head.csv
          echo
      - name: Save report to the probe-results branch
        if: always()
        run: |
          sleep 2
          git config user.name transit-pulse-bot
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan probe-results
          git rm -rfq . >/dev/null
          cp /tmp/report.txt report.txt
          git add report.txt
          git commit -qm "Probe report"
          git push -qf origin probe-results

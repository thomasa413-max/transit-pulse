name: Screenshot live pages (manual)

# Screenshots of the live site in a real browser with WebGL, saved to the "previews" branch.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Space-separated paths"
        default: "/fr/carte/ /de/karte/"

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Screenshots
        continue-on-error: true
        run: |
          set -o pipefail
          ( pip install -q playwright tzdata && python -m playwright install --with-deps chromium >/dev/null \
            && python scripts/screenshots.py /tmp/shots ${{ inputs.paths }} ) 2>&1 | tail -40 | tee /tmp/log.txt
      - name: Save to the previews branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp /tmp/log.txt /tmp/shots/ 2>/dev/null || true
          git config --global user.name transit-pulse-bot
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q /tmp/r && cd /tmp/r && cp /tmp/shots/* . && git checkout -q -b previews && git add -A && git commit -qm "Live screenshots"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" previews
